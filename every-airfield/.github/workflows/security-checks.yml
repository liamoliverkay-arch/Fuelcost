# Runs on every push and pull request: the server tests (including security headers and the
# Content Security Policy check) and the Supabase function tests (every sign-in rule, against a real
# Postgres). Actions are pinned to exact commits, not tags, so nobody can swap in different code.
name: Security checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b   # v5.3.0
        with:
          python-version: "3.12"
      - uses: denoland/setup-deno@909cc5acb0fdd60627fb858598759246509fa755   # v2.0.2
        with:
          deno-version: v2.1.4
      - name: Content Security Policy matches the page's script
        run: python3 -I tools/csp.py --check
      - name: Server tests (prices, planes, security headers, blocked files)
        run: python3 -I tests/test_server.py "$PWD"
      - name: Supabase function tests (sign-in rules, lockouts, bans, prices)
        run: deno test -A supabase/tests/
      - name: Type-check the server functions
        run: deno check supabase/functions/*/index.ts
